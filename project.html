<script src="content.js"></script>
<script>
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* always open a project at the top, on the full-screen video or photo
   (stops the browser, or a preview frame, from keeping the old scroll position) */
if('scrollRestoration' in history)history.scrollRestoration='manual';
const toTop=()=>{window.scrollTo(0,0);if(window.top!==window){try{document.documentElement.scrollIntoView({block:'start'})}catch(e){}}};
addEventListener('DOMContentLoaded',toTop);addEventListener('load',toTop);addEventListener('pageshow',toTop);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* quiet placeholder: faint perspective lines, replaced by the real photo when it loads */
function phSvg(seed){const vx=30+(seed*37)%40,vy=42+(seed*13)%16;let g='';
  for(let i=0;i<=10;i++){const x=i*10;g+=`<line x1="${vx}" y1="${vy}" x2="${x}" y2="100"/><line x1="${vx}" y1="${vy}" x2="${x}" y2="0" opacity=".5"/>`}
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><g stroke="var(--tone-line)" stroke-width=".25" vector-effect="non-scaling-stroke">${g}<line x1="0" y1="${vy}" x2="100" y2="${vy}" stroke="var(--brown)" opacity=".35"/></g></svg>`}
function fillPh(el,seed){el.insertAdjacentHTML('afterbegin',phSvg(seed));if(el.dataset.ph)el.insertAdjacentHTML('beforeend',`<em>${el.dataset.ph}</em>`);
  if(el.dataset.img){const im=document.createElement('img');im.alt='';im.loading=el.closest('.hero,.phero')?'eager':'lazy';im.decoding='async';im.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s';im.onload=()=>{im.style.opacity=1;const e=el.querySelector('em');if(e)e.remove()};im.onerror=()=>im.remove();im.src=el.dataset.img;el.appendChild(im)}}
function wireVideos(root){root.querySelectorAll('video').forEach(v=>{
  if(reduce){v.removeAttribute('autoplay');v.pause();v.controls=true;return}
  if('IntersectionObserver' in window){new IntersectionObserver(es=>es.forEach(e=>{e.isIntersecting?v.play().catch(()=>{}):v.pause()}),{threshold:.2}).observe(v)}})}

/* which project? */
const slug=new URLSearchParams(location.search).get('p')||P[0].slug;
const i=Math.max(-1,P.findIndex(p=>p.slug===slug)),p=P[i];
/* a single competition entry has its own page: project.html?p=competitions-awards&e=<entry slug> */
const eSlug=new URLSearchParams(location.search).get('e');
const E=p&&p.entries&&eSlug?p.entries.find(e=>e.slug===eSlug&&!e.soon):null;
$('plist').innerHTML=P.map(q=>`<li><a href="project.html?p=${q.slug}"${q===p?' aria-current="page"':''}>${esc(q.title)}</a></li>`).join('');

/* an empty slot: a dashed "To add" box while SHOW_EMPTY is on, nothing once it is off */
const todo=t=>SHOW_EMPTY?`<p class="todo">To add: ${t}</p>`:'';
/* a photo slot: placeholder until the file exists; with SHOW_EMPTY off, a missing photo is removed */
function photo(src,cap,cls,seed){return `<figure class="${cls||''}" data-src="${src}"><div class="ph" role="img" aria-label="${esc(cap)||'Project photo'}" data-ph="${SHOW_EMPTY?'Photo to add: '+src.replace('images/',''):''}" data-img="${src}" data-seed="${seed}"></div>${cap?`<figcaption class="cap">${esc(cap)}</figcaption>`:''}</figure>`}

/* ---------- drawn diagrams for competition entries ---------- */
/* numbered legend under a plan drawing */
function detailsHTML(list,base){return `<section class="diag"><span class="sub">Construction details</span>
  <div class="dets">${list.map(([t,notes],k)=>`<figure class="det"><img src="${base}detail-${k+1}.png" alt="${esc(t)}" loading="lazy"><figcaption><b>${esc(t)}</b><ul>${notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></figcaption></figure>`).join('')}</div></section>`}
function legendHTML(rows){return `<ol class="plegend">${rows.map(([n])=>`<li>${esc(n)}</li>`).join('')}</ol>`}
/* one plan, four ways to live: each floor drawn as rooms, coloured by who lives there */
const WHO={a:['var(--brown)','Household 1'],b:['#5f7a86','Household 2'],c:['#9a9483','Shared / guests']};
const GF=[['Bedroom',0,0,4,3],['WC',4.2,0,1.8,2],['Kitchen',6.2,0,3.8,3.4],['Stair',0,3.2,4,2,'s'],['Dining',4.2,3.6,5.8,2.4],['Living',4.2,6.2,5.8,4.3]];
const FF=[['Bedroom',0,0,4,3],['WC',4.2,0,1.8,2],['Bedroom',6.2,0,3.8,4],['Stair',0,3.2,4,2,'s'],['WC',6.2,4.2,3.8,1.4],['Terrace',0,5.4,4,4.6,'o'],['Bedroom',4.2,5.8,5.8,3.4],['Balcony',4.2,9.4,5.8,1.1,'o']];
function floorSVG(rooms,who,label){const col=WHO[who][0];
  return `<figure class="floor"><svg viewBox="-0.3 -0.3 10.6 11.1" role="img" aria-label="${label}">${rooms.map(([n,x,y,w,h,t])=>{
    const f=t==='s'?'var(--tone-line)':col,op=t==='o'?.35:t==='s'?1:.85;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx=".15" fill="${f}" fill-opacity="${op}" stroke="var(--ground)" stroke-width=".12"/>${w>1.9?`<text x="${x+w/2}" y="${y+h/2}" text-anchor="middle" dominant-baseline="middle" font-size=".62" fill="${t==='s'||t==='o'?'var(--ink)':'#fff'}">${n}</text>`:''}`}).join('')}</svg><figcaption>${label}</figcaption></figure>`}
function scenariosHTML(list){
  return `<section class="diag"><span class="sub">One plan, four ways to live</span>
    <div class="scen">${list.map(s=>`<div class="scard"><div class="scard-h"><b>${s.key}</b><h3>${esc(s.title)}</h3></div>
      <div class="floors">${floorSVG(GF,s.gf,'Ground floor')}${floorSVG(FF,s.ff,'First floor')}</div>
      <p>${esc(s.text)}</p></div>`).join('')}</div>
    <p class="legend">${Object.values(WHO).map(([c,t])=>`<span><i style="background:${c}"></i>${t}</span>`).join('')}<span><i style="background:var(--tone-line)"></i>Shared stair</span></p></section>`}
/* site to massing: four small isometric steps */
function iso(x,y,z){return [(x-y)*.866,(x+y)*.5-z]}
const P2=pts=>pts.map(p=>iso(...p).map(v=>v.toFixed(2)).join(',')).join(' ');
function poly(pts,fill,op=1,stroke='var(--ink)'){return `<polygon points="${P2(pts)}" fill="${fill}" fill-opacity="${op}" stroke="${stroke}" stroke-width=".08" stroke-linejoin="round"/>`}
function massingHTML(steps){
  const W=9,D=12,plot=[[0,0,0],[W,0,0],[W,D,0],[0,D,0]];
  const bx=[.6,2],bw=W-1.2,bd=D-4;                       /* buildable area inside the setbacks */
  const L=[[bx[0],bx[1]],[bx[0]+bw,bx[1]],[bx[0]+bw,bx[1]+bd],[bx[0]+bw*.45,bx[1]+bd],[bx[0]+bw*.45,bx[1]+bd*.5],[bx[0],bx[1]+bd*.5]];
  const flat=(pts,z)=>pts.map(([x,y])=>[x,y,z]);
  const buildable=flat([[bx[0],bx[1]],[bx[0]+bw,bx[1]],[bx[0]+bw,bx[1]+bd],[bx[0],bx[1]+bd]],.01);
  function prism(pts,h){let faces=[];
    for(let i=0;i<pts.length;i++){const A=pts[i],B=pts[(i+1)%pts.length],nx=B[1]-A[1],ny=-(B[0]-A[0]);
      if(nx<=0&&ny<=0)continue;                        /* face turned away from the viewer */
      faces.push({d:(A[0]+A[1]+B[0]+B[1])/2,c:nx>0?'#6f4824':'#8a5a2b',A,B})}
    faces.sort((p,q)=>p.d-q.d);
    let out=faces.map(({c,A,B})=>poly([[A[0],A[1],0],[B[0],B[1],0],[B[0],B[1],h],[A[0],A[1],h]],c,1)
      +`<line x1="${iso(A[0],A[1],h/2)[0]}" y1="${iso(A[0],A[1],h/2)[1]}" x2="${iso(B[0],B[1],h/2)[0]}" y2="${iso(B[0],B[1],h/2)[1]}" stroke="#fff" stroke-opacity=".45" stroke-width=".07"/>`).join('');
    out+=poly(flat(pts,h),'#b0804f',1);return out}
  const views=[poly(plot,'var(--tone)',1),
    poly(plot,'var(--tone)',1)+poly(buildable,'var(--brown)',.25,'var(--brown)'),
    poly(plot,'var(--tone)',1)+poly(buildable,'var(--brown)',.12,'var(--brown)')+poly(flat(L,.02),'var(--brown)',.6),
    poly(plot,'var(--tone)',1)+prism(L,6.5)];
  return `<section class="diag"><span class="sub">From site to massing</span><ol class="mass">${steps.map((t,k)=>`<li><svg viewBox="-11.5 -8 22 20" role="img" aria-label="${esc(t)}">${views[k]||''}</svg><span><b>${String(k+1).padStart(2,'0')}</b>${esc(t)}</span></li>`).join('')}</ol></section>`}

if(!p){$('case').innerHTML=`<div class="notfound"><span class="label">Project not found</span><h1>This project isn't on the site yet.</h1><a class="btn" href="index.html#projects">See all projects</a></div>`}
else{
  document.title=`${E?E.name+' · '+p.title:p.title} · Alag Perspective Architects`;
  document.querySelector('meta[name=description]').content=p.hook||`${p.title}, a project by Alag Perspective Architects, Nagpur.`;
  const facts=(p.facts||[]).filter(f=>f[1]||SHOW_EMPTY);
  const story=[['The challenge',p.c],['Our response',p.r],['The outcome',p.o]];
  const photos=p.photos||[''];
  const nx=P[(i+1)%P.length];
  /* PAGE ORDER: 1 full-screen hero (wide video if heroVideo is set, else the cover photo) with the title on it,
     2 key facts, 3 the best photos, 4 walk-through videos, 5 the story, 6 the rest of the photos */
  const vid=E?E.video:p.heroVideo;
  $('phero').innerHTML=(vid
      ?`<video class="phero-media" src="${vid}" poster="${vid.replace('.mp4','.jpg')}" muted loop playsinline autoplay preload="auto" aria-label="${esc(p.title)} walk-through"></video>
        <button class="phero-play" type="button" aria-pressed="false">Pause video</button>`
      :`<div class="ph phero-media" role="img" aria-label="${esc(E?E.name:(photos[0]||p.title))}" data-img="${E?(E.dir?E.dir+'/':'images/'+p.slug+'-'+E.slug+'-')+'1.jpg':'images/'+p.slug+'-1.jpg'}" data-seed="${i+1}"></div>`)
    +(E?`<div class="phero-over"><div class="wrap"><span class="label">${esc(p.title)}${E.year?' · '+esc(E.year):''}</span>
      <h1>${esc(E.name)}</h1>${(E.competition||E.theme)?`<p>${esc(E.competition||E.theme)}</p>`:''}</div></div>`
    :`<div class="phero-over"><div class="wrap"><span class="label">${String(i+1).padStart(2,'0')} · ${esc(p.cat)}${p.loc?' · '+esc(p.loc):''}</span>
      <h1>${esc(p.title)}</h1>${p.hook?`<p>${esc(p.hook)}</p>`:''}</div></div>`)+`
      <a class="phero-down" href="#case" aria-label="See the project">Scroll</a>`;
  const vb=$('phero').querySelector('.phero-play');
  if(vb){const v=$('phero').querySelector('video');
    if(reduce){v.removeAttribute('autoplay');v.pause();vb.textContent='Play video'}
    vb.onclick=()=>{if(v.paused){v.play();vb.textContent='Pause video';vb.setAttribute('aria-pressed','false')}else{v.pause();vb.textContent='Play video';vb.setAttribute('aria-pressed','true')}}}

  let h='';
  if(!p.hook)h+=todo('a one-line description (hook)');
  if(facts.length)h+=`<dl class="facts row">${facts.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${v?esc(v):'<span class="muted">to add</span>'}</dd></div>`).join('')}</dl>`;

  /* best photos first: with a video hero the cover photo leads; otherwise start from photo 2 */
  const all=photos.map((cap,k)=>({cap,n:k+1})).filter(x=>vid||x.n>1);
  const best=all.slice(0,3),rest=all.slice(3);
  const fig=(x,cls)=>photo(`images/${p.slug}-${x.n}.jpg`,x.cap,cls,i+x.n+3);
  const roomsFirst=p.entryKind==='room'&&!E;
  const areas=p.floors;
  if(best.length&&!roomsFirst&&!areas)h+=`<div class="gallery best">${best.map((x,k)=>fig(x,k===0?'wide':'')).join('')}</div>`;

  if(p.video&&p.video.length)h+=`<div><span class="sub">Walk-through videos</span><div class="reels${p.video.length===1?' one':''}" style="margin-top:16px">${p.video.map(([v,cap])=>`<figure><video src="${v}" poster="${v.replace('.mp4','.jpg')}" muted loop playsinline autoplay preload="metadata" aria-label="${esc(cap)}"></video><figcaption>${esc(cap)}</figcaption></figure>`).join('')}</div></div>`;
  else if(SHOW_EMPTY&&!vid&&!p.entries&&!p.floors)h+=todo(`walk-through video (optional) – a wide one can play at the top: heroVideo:'videos/${p.slug}-walkthrough.mp4'`);

  if(!p.entries&&(story.some(s=>s[1])||SHOW_EMPTY))h+=`<div class="story">${story.map(([k,v])=>`<div><small>${k}</small>${v?`<p>${esc(v)}</p>`:todo(k.toLowerCase())}</div>`).join('')}</div>`;
  /* FLOORS: one page that walks through the house floor by floor, with a jump bar at the top */
  if(areas){
    const gal=(list,seed)=>`<div class="gallery">${(list||[]).map(([src,cap,w],k)=>photo(src,cap,w||'',seed+k)).join('')}</div>`;
    const reel=(v,name)=>v?`<div class="reels one"><figure><video src="${v}" poster="${v.replace('.mp4','.jpg')}" muted loop playsinline autoplay preload="metadata" aria-label="${esc(name)} walk-through"></video><figcaption>${esc(name)}: walk-through</figcaption></figure></div>`:'';
    h+=`<nav class="areas-nav" aria-label="Floors of the house">${areas.map(a=>`<a href="#area-${a.slug}">${esc(a.name)}</a>`).join('')}</nav>`;
    h+=areas.map((a,n)=>`<div class="area" id="area-${a.slug}">
      <div class="floor-head${a.plan?'':' solo'}"><div class="area-head"><span class="sub">${String(n+1).padStart(2,'0')}</span><h2>${esc(a.name)}</h2>${a.text?`<p>${esc(a.text)}</p>`:(a.drawings?'':todo('a few lines about this floor'))}
        ${(a.links||[]).length?`<div class="entry-jump">${a.links.map(([href,t,d])=>`<a href="${href}">${esc(t)} →<span>${esc(d)}</span></a>`).join('')}</div>`:''}</div>
        ${a.plan?`<div class="gallery entry-gal draw plan-fig">${photo(a.plan[0],a.plan[1],'',n+40)}</div>`:''}</div>
      ${a.compare?`<div class="cmp" style="--x:50%"><img src="${a.compare[1]}" alt="The built house"><img class="cmp-draw" src="${a.compare[0]}" alt="The drawing"><div class="cmp-handle"><span class="cmp-knob" aria-hidden="true">⇆</span></div><span class="cmp-tag l">Drawing</span><span class="cmp-tag r">Built</span><input type="range" min="0" max="100" value="50" aria-label="${esc(a.compare[2])}"></div><p class="cap cmp-cap">${esc(a.compare[2])}</p>`:''}
      ${a.drawings?`<div class="gallery entry-gal draw">${(a.photos||[]).map(([src,cap],k)=>photo(src,cap,'',n+50+k)).join('')}</div>`:''}
      ${(a.rooms||[]).map((r,m)=>`<div class="room"><div class="area-head"><h3>${esc(r.name)}</h3>${r.text?`<p>${esc(r.text)}</p>`:''}</div>${reel(r.video,r.name)}${r.hot?`<figure class="hot"><img src="${r.hot.src}" alt="${esc(r.name)}">${r.hot.spots.map(([x,y,t,d])=>`<button type="button" class="dot" style="left:${x}%;top:${y}%" data-t="${esc(t)}" data-d="${esc(d)}" aria-label="${esc(t)}"></button>`).join('')}<figcaption class="cap">${esc(r.hot.cap)}</figcaption></figure>`:''}${gal(r.photos,i+n*10+m*5+3)}</div>`).join('')}
    </div>`).join('');
  }
  if(rest.length&&!roomsFirst&&!areas)h+=`<div><span class="sub">More from the project</span><div class="gallery" style="margin-top:16px">${rest.map((x,k)=>fig(x,k%3===2?'wide':'')).join('')}</div></div>`;
  /* COMPETITIONS: the main page shows one card per entry; each card opens the entry's own page */
  const room=p.entryKind==='room';
  if(p.entries&&!E){const es=p.entries.filter(e=>e.name||SHOW_EMPTY);
    h+=`<div class="ecards">${es.map((e,k)=>e.soon?`<div class="ecard soon" aria-label="${esc(e.name)}, coming soon">
      <div class="soon-box" aria-hidden="true"></div>
      <span class="badge">Coming soon</span><h3>${esc(e.name)}</h3><p>${esc(e.place||'')}</p></div>`:`<a class="ecard" href="project.html?p=${p.slug}&e=${e.slug}">
      ${room&&e.video&&!(e.photos||[]).length?`<div class="ph ecard-vid"><video src="${e.video}" muted loop playsinline autoplay preload="metadata" aria-label="${esc(e.name)} walk-through"></video></div>`:`<div class="ph" role="img" aria-label="${esc(e.name)}" data-img="${e.dir?e.dir+'/':'images/'+p.slug+'-'+e.slug+'-'}1.jpg" data-seed="${k+3}"></div>`}
      <span class="badge">${[e.result,e.level,e.year].filter(Boolean).map(esc).join(' · ')}</span><h3>${esc(e.name)}</h3><p>${esc(e.competition||e.theme||'')}</p></a>`).join('')}</div>`;
    if(SHOW_EMPTY)h+=todo(room?'more bedrooms – copy a room block in content.js, give it a new slug and make its folders':'more competitions – copy the entry block in content.js and give it a new slug');}
  if(E){const base=E.dir?E.dir+'/':`images/${p.slug}-${E.slug}-`,ph=E.photos||[],es=p.entries.filter(x=>!x.soon),k=es.indexOf(E),nE=es[(k+1)%es.length];
    const facts=(room?(E.facts||[]).filter(f=>f[1]||SHOW_EMPTY):[['Result',E.result],['Competition',E.competition],['Level',E.level],['Year',E.year],['Site',E.place]].filter(f=>f[1]));
    /* renders first: with a video on top the cover photo leads the gallery */
    const pics=ph.map((cap,n)=>({cap,n:n+1})).filter(x=>vid||x.n>1);
    h=`${facts.length?`<dl class="facts row">${facts.map(([a,b])=>`<div><dt>${a}</dt><dd>${b?esc(b):'<span class="muted">to add</span>'}</dd></div>`).join('')}</dl>`:''}
      ${room?`<div class="story two">${E.theme?`<div><small>The theme</small><p>${esc(E.theme)}</p></div>`:todo('the theme')}${E.text?`<div><small>The room</small><p>${esc(E.text)}</p></div>`:todo('a few lines about the room')}</div>`:''}
      <div class="story two" ${room?'hidden':''}>${E.brief?`<div><small>The brief</small><p>${esc(E.brief)}</p></div>`:todo('the brief')}${E.idea?`<div><small>Our idea</small><p>${esc(E.idea)}</p></div>`:todo('your idea')}</div>
      ${pics.length?`<div class="gallery entry-gal">${pics.slice(0,3).map((x,j)=>photo(base+x.n+'.jpg',x.cap,j===0?'wide':'',x.n+2)).join('')}</div>`:''}
      ${E.scenarios?scenariosHTML(E.scenarios):''}
      ${E.massing?massingHTML(E.massing):''}
      ${pics.length>3?`<div><span class="sub">${room?'More photos':'Drawings'}</span><div class="gallery entry-gal" style="margin-top:16px">${pics.slice(3).map((x,j)=>{const lg=E.legends&&E.legends[x.n];const f=photo(base+x.n+'.jpg',x.cap,lg?'plan':'',x.n+2);return lg?f.replace('</figure>',legendHTML(lg)+'</figure>'):f}).join('')}</div></div>`:''}
      ${E.details?detailsHTML(E.details,base):''}
      <div class="next">${es.length>1?`<a class="nx" href="project.html?p=${p.slug}&e=${nE.slug}"><small>${room?'Next bedroom':'Next competition'}</small><b>${esc(nE.name)} →</b></a>`:`<a class="nx" href="project.html?p=${p.slug}"><small>Back to</small><b>${room?'All bedrooms':'All competitions'} →</b></a>`}<a class="btn" href="index.html#contact">Book a free consultation</a></div>`;}

  if(p.items){const its=p.items.map((t,k)=>({...t,k})).filter(t=>t.name||SHOW_EMPTY);
    if(its.length&&its.some(t=>t.photos))h+=`<div><span class="sub">${esc(p.itemsTitle||'')}</span><div class="sites">${its.map(t=>`<div class="site">
        <div class="site-info"><span class="status">${esc(t.status||'')}</span><h3>${t.name?esc(t.name):'<span class="muted">Name to add</span>'}</h3>${t.place?`<span class="place">${esc(t.place)}</span>`:todo('where the site is')}${t.text?`<p>${esc(t.text)}</p>`:todo('two lines about the site')}</div>
        <div class="site-photos">${(t.photos||[]).map(([src,sh],n)=>photo(src,'',sh==='tall'?'tall':'wide',t.k*5+n+7)).join('')}</div></div>`).join('')}</div></div>`;
    else     if(its.length)h+=`<div><span class="sub">${esc(p.itemsTitle||'')}</span><div class="items" style="margin-top:16px">${its.map(t=>{const src=`images/${p.slug}-${p.slug==='sites-in-progress'?'site':'item'}-${t.k+1}.jpg`;
      return `<div class="item" data-src="${src}"><div class="ph" role="img" aria-label="${esc(t.name)||'Photo'}" data-ph="${SHOW_EMPTY?'Photo to add: '+src.replace('images/',''):''}" data-img="${src}" data-seed="${t.k+7}"></div>
        <div class="meta"><span>${esc(t.place)}</span>${t.status?`<span class="status">${esc(t.status)}</span>`:''}</div>
        <h3>${t.name?esc(t.name):'<span class="muted">Name to add</span>'}</h3>${t.text?`<p>${esc(t.text)}</p>`:todo('two lines about it')}</div>`}).join('')}</div></div>`}
  if(!E)h+=`<div class="next">${P.length>1?`<a class="nx" href="project.html?p=${nx.slug}"><small>Next project</small><b>${esc(nx.title)} →</b></a>`:'<span></span>'}<a class="btn" href="index.html#contact">Book a free consultation</a></div>`;
  if(E){const bk=document.querySelector('.crumbs .link');bk.href=`project.html?p=${p.slug}`;bk.textContent=p.entryKind==='room'?'← All bedrooms':'← All competitions'}
  $('case').innerHTML=h;$('case').dataset.slug=p.slug;
  $('phero').querySelectorAll('.ph').forEach(el=>fillPh(el,+el.dataset.seed||1));wireVideos($('phero'));
  $('case').querySelectorAll('.ph').forEach(el=>{fillPh(el,+el.dataset.seed||1);
    /* gallery photos keep their own shape (portrait stays portrait); the top photo becomes 4:3 if it is portrait */
    const im=el.querySelector('img');if(im)im.addEventListener('load',()=>{const r=im.naturalWidth/im.naturalHeight,fig=el.closest('.gallery figure');
      if(fig&&(fig.closest('.entry-gal')||fig.classList.contains('nocrop'))){el.style.aspectRatio=String(r);if(r>2)fig.classList.add('wide');else if(r<1)fig.classList.remove('wide')}
      else if(fig){el.style.aspectRatio=r>1.2?'':String(Math.max(r,.75));if(r<1)fig.classList.remove('wide')}
      else if(el.classList.contains('big')&&r<1.1)el.style.aspectRatio='4/3'});
    if(!SHOW_EMPTY){const box=el.closest('figure,.item');const t=new Image();t.onerror=()=>{if(box&&box.tagName==='FIGURE')box.remove();else el.remove()};t.src=el.dataset.img}});
  wireVideos($('case'));
  /* drawing-to-photo slider */
  $('case').querySelectorAll('.cmp').forEach(box=>{const r=box.querySelector('input'),set=v=>box.style.setProperty('--x',v+'%');r.addEventListener('input',()=>set(r.value));
    if(!reduce)new IntersectionObserver((es,o)=>{if(!es[0].isIntersecting)return;o.disconnect();let t0=0;const go=t=>{t0=t0||t;const k=(t-t0)/2200;if(r.value!=50)return;if(k<1){set(50+28*Math.sin(k*Math.PI*2)*(1-k));requestAnimationFrame(go)}else set(50)};requestAnimationFrame(go)},{threshold:.5}).observe(box)});
  /* material hotspots */
  {let tip=null,cur=null;const close=()=>{if(tip){tip.remove();tip=null;cur=null}};
   $('case').querySelectorAll('.hot .dot').forEach(d=>d.addEventListener('click',e=>{e.stopPropagation();if(cur===d){close();return}close();cur=d;const box=d.parentElement;
     tip=document.createElement('div');tip.className='tip';tip.setAttribute('role','status');tip.innerHTML=`<b>${d.dataset.t}</b>${d.dataset.d}`;box.appendChild(tip);
     const w=tip.offsetWidth,h=tip.offsetHeight,bw=box.clientWidth,bh=box.querySelector('img').clientHeight;let x=d.offsetLeft+22,y=d.offsetTop-h/2;if(x+w>bw-12)x=d.offsetLeft-22-w;
     tip.style.left=Math.max(12,x)+'px';tip.style.top=Math.max(12,Math.min(y,bh-h-12))+'px'}));
   document.addEventListener('click',close);document.addEventListener('keydown',e=>{if(e.key==='Escape')close()})}
  /* tap a competition drawing to see it large */
  const lb=document.createElement('dialog');lb.className='lightbox';lb.innerHTML='<button type="button" class="lb-x">Close</button><img alt=""><p class="cap"></p>';document.body.appendChild(lb);
  lb.onclick=ev=>{if(ev.target===lb||ev.target.classList.contains('lb-x'))lb.close()};
  $('case').querySelectorAll('.entry-gal figure,.det,.room .gallery figure,.site-photos figure').forEach(f=>{f.style.cursor='zoom-in';f.addEventListener('click',()=>{const im=f.querySelector('img');if(!im)return;
    lb.querySelector('img').src=im.src;lb.querySelector('img').alt=f.querySelector('.cap')?.textContent||'';lb.querySelector('p').textContent=f.querySelector('.cap')?.textContent||'';lb.showModal()})});
}

if(typeof REVIEWS!=='undefined'&&REVIEWS.length)document.querySelectorAll('.rv-link').forEach(a=>a.hidden=false);
/* drawer */
const drawer=$('drawer'),burger=$('burger');
burger.onclick=()=>{drawer.hidden=false;burger.setAttribute('aria-expanded','true');$('dclose').focus()};
const shut=()=>{drawer.hidden=true;burger.setAttribute('aria-expanded','false')};
$('dclose').onclick=shut;drawer.querySelectorAll('a').forEach(a=>a.addEventListener('click',shut));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!drawer.hidden)shut()});

</script>
</body>
</html>
